<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 540" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#455a64"/>
    </marker>
    <marker id="d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e65100"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1280" height="540" fill="#fafafa"/>
  <text x="30" y="40" font-size="24" font-weight="700" fill="#263238">Automated purchase cycle &amp; data chaining</text>
  <text x="30" y="66" font-size="14" fill="#607d8b">Grey arrow = call sequence. Orange arrow = data from a response reused in the next call.</text>

  <!-- Legend -->
  <line x1="30" y1="86" x2="70" y2="86" stroke="#455a64" stroke-width="2" marker-end="url(#a)"/>
  <text x="78" y="90" font-size="12.5" fill="#455a64">sequence</text>
  <line x1="170" y1="86" x2="210" y2="86" stroke="#e65100" stroke-width="2.5" stroke-dasharray="5 3" marker-end="url(#d)"/>
  <text x="218" y="90" font-size="12.5" fill="#e65100" font-weight="600">data chaining</text>

  <!-- Row 1: auth + catalogue -->
  <g font-size="12.5">
    <rect x="30"  y="120" width="150" height="52" rx="6" fill="#eceff1" stroke="#607d8b"/><text x="42" y="142" fill="#37474f">POST /security/token</text><text x="42" y="160" fill="#607d8b">→ accessToken</text>
    <rect x="220" y="120" width="150" height="52" rx="6" fill="#e3f2fd" stroke="#1976d2"/><text x="232" y="142" fill="#0d47a1">POST /auth/signin</text><text x="232" y="160" fill="#e65100">→ accountCode</text>
    <rect x="410" y="120" width="200" height="52" rx="6" fill="#f3e5f5" stroke="#8e24aa"/><text x="422" y="142" fill="#6a1b9a">GET /offer/</text><text x="422" y="160" fill="#e65100">findOfferCodesByFamily → offerCode</text>
    <rect x="650" y="120" width="220" height="52" rx="6" fill="#fff3e0" stroke="#fb8c00"/><text x="662" y="142" fill="#e65100">GET /performance/findPerformanceByDay</text><text x="662" y="160" fill="#e65100">→ performanceCode, date</text>
    <rect x="910" y="120" width="200" height="52" rx="6" fill="#f3e5f5" stroke="#8e24aa"/><text x="922" y="142" fill="#6a1b9a">GET /product/</text><text x="922" y="160" fill="#e65100">findProductCodes → productCode</text>

    <line x1="180" y1="146" x2="220" y2="146" stroke="#455a64" stroke-width="2" marker-end="url(#a)"/>
    <line x1="370" y1="146" x2="410" y2="146" stroke="#455a64" stroke-width="2" marker-end="url(#a)"/>
    <line x1="610" y1="146" x2="650" y2="146" stroke="#455a64" stroke-width="2" marker-end="url(#a)"/>
    <line x1="870" y1="146" x2="910" y2="146" stroke="#455a64" stroke-width="2" marker-end="url(#a)"/>
  </g>
  <text x="220" y="195" font-size="11.5" fill="#1565c0">(B2B: here — B2C: moved after checkCart)</text>

  <!-- Row 2: cart to confirm -->
  <g font-size="12.5">
    <rect x="30"  y="250" width="190" height="56" rx="6" fill="#e8f5e9" stroke="#43a047" stroke-width="2"/><text x="42" y="272" fill="#2e7d32" font-weight="600">POST /cart/checkCart</text><text x="42" y="292" fill="#e65100">→ cartCode, total</text>
    <rect x="270" y="250" width="210" height="56" rx="6" fill="#e3f2fd" stroke="#1976d2" stroke-dasharray="4 3"/><text x="282" y="272" fill="#0d47a1">B2C only: (createAccount) +</text><text x="282" y="292" fill="#0d47a1">POST /auth/signin</text>
    <rect x="530" y="250" width="200" height="56" rx="6" fill="#fce4ec" stroke="#d81b60" stroke-width="2"/><text x="542" y="272" fill="#ad1457" font-weight="600">POST /order/beginOrderTrans</text><text x="542" y="292" fill="#e65100">(cartCode) → orderCode</text>
    <rect x="780" y="250" width="210" height="56" rx="6" fill="#fce4ec" stroke="#d81b60"/><text x="792" y="272" fill="#ad1457">POST /order/confirmOrderTrans</text><text x="792" y="292" fill="#607d8b">(orderCode, EMULATEPAY)</text>
    <rect x="1040" y="250" width="200" height="56" rx="6" fill="#e0f2f1" stroke="#00897b"/><text x="1052" y="272" fill="#00695c">GET /order/readOrderDetails</text><text x="1052" y="292" fill="#607d8b">(validation)</text>

    <line x1="220" y1="278" x2="270" y2="278" stroke="#455a64" stroke-width="2" marker-end="url(#a)"/>
    <line x1="480" y1="278" x2="530" y2="278" stroke="#455a64" stroke-width="2" marker-end="url(#a)"/>
    <line x1="730" y1="278" x2="780" y2="278" stroke="#455a64" stroke-width="2" marker-end="url(#a)"/>
    <line x1="990" y1="278" x2="1040" y2="278" stroke="#455a64" stroke-width="2" marker-end="url(#a)"/>
  </g>

  <!-- link row1 to row2 -->
  <line x1="1010" y1="172" x2="1010" y2="210" stroke="#455a64" stroke-width="2"/>
  <line x1="1010" y1="210" x2="125" y2="210" stroke="#455a64" stroke-width="2"/>
  <line x1="125" y1="210" x2="125" y2="250" stroke="#455a64" stroke-width="2" marker-end="url(#a)"/>

  <!-- data chain cartCode / orderCode -->
  <path d="M125,306 C125,340 480,340 625,340 L625,306" fill="none" stroke="#e65100" stroke-width="2.5" stroke-dasharray="5 3" marker-end="url(#d)"/>
  <text x="300" y="334" font-size="11.5" fill="#e65100" font-weight="600">cartCode → beginOrderTrans</text>
  <path d="M630,306 C630,360 790,360 885,360 L885,306" fill="none" stroke="#e65100" stroke-width="2.5" stroke-dasharray="5 3" marker-end="url(#d)"/>
  <text x="700" y="378" font-size="11.5" fill="#e65100" font-weight="600">orderCode → confirmOrderTrans</text>

  <!-- generated data -->
  <rect x="30" y="410" width="1210" height="90" rx="10" fill="#ffffff" stroke="#90a4ae" stroke-width="1.5"/>
  <text x="48" y="436" font-size="15" font-weight="700" fill="#37474f">Generated customer data (account creation)</text>
  <text x="48" y="462" font-size="12.5" fill="#455a64">Placeholders resolved client-side before sending: {{@firstName}} {{@lastName}} {{@email}} {{@address}} {{@country}} {{@phone}} {{@login}} {{@password}}</text>
  <text x="48" y="484" font-size="12.5" fill="#455a64">createAccount fields (dev B2C mask): 1 = first name, 3 = last name, 21 = email, 548 = username, 549 = password. Values stay stable for the whole run.</text>
</svg>
