<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1040" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#455a64"/>
    </marker>
    <marker id="arrData" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e65100"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1500" height="1020" fill="#fafafa"/>
  <text x="30" y="40" font-size="26" font-weight="700" fill="#263238">Backoffice API flows by front-end journey — apibosweb → unified-backoffice v1.11.17</text>
  <text x="30" y="66" font-size="14" fill="#607d8b">Each block = a real backoffice route.  Grey arrow = call sequence.  Orange arrow = data reinjected from a response into the next call.</text>

  <!-- Legend -->
  <line x1="30" y1="88" x2="70" y2="88" stroke="#455a64" stroke-width="2" marker-end="url(#arr)"/>
  <text x="78" y="92" font-size="13" fill="#455a64">sequence</text>
  <line x1="170" y1="88" x2="210" y2="88" stroke="#e65100" stroke-width="2.5" stroke-dasharray="5 3" marker-end="url(#arrData)"/>
  <text x="218" y="92" font-size="13" fill="#e65100" font-weight="600">data chaining</text>

  <!-- ===== TOKEN (infra) ===== -->
  <g>
    <rect x="30" y="115" width="260" height="60" rx="8" fill="#eceff1" stroke="#607d8b" stroke-width="1.5"/>
    <text x="45" y="140" font-size="14" font-weight="700" fill="#37474f">0 · TOKEN (global prerequisite)</text>
    <text x="45" y="160" font-size="12.5" fill="#455a64">POST /security/token</text>
  </g>
  <text x="310" y="150" font-size="12.5" fill="#e65100" font-weight="600">accessToken ⮑ Bearer on ALL calls below</text>

  <!-- ===== 1 AUTH ===== -->
  <g>
    <rect x="30" y="200" width="440" height="130" rx="10" fill="#e3f2fd" stroke="#1976d2" stroke-width="1.5"/>
    <text x="45" y="224" font-size="15" font-weight="700" fill="#0d47a1">1 · Authentication (login)</text>
    <rect x="48" y="238" width="180" height="40" rx="6" fill="#fff" stroke="#1976d2"/>
    <text x="58" y="255" font-size="12" fill="#0d47a1">POST /auth/signin</text>
    <text x="58" y="271" font-size="11" fill="#607d8b">→ accountCode</text>
    <rect x="268" y="238" width="180" height="40" rx="6" fill="#fff" stroke="#1976d2"/>
    <text x="278" y="255" font-size="12" fill="#0d47a1">GET /account/readAccount</text>
    <text x="278" y="271" font-size="11" fill="#607d8b">(accountCode)</text>
    <line x1="228" y1="258" x2="268" y2="258" stroke="#e65100" stroke-width="2.5" stroke-dasharray="5 3" marker-end="url(#arrData)"/>
    <text x="48" y="308" font-size="11.5" fill="#1565c0">password reset: searchLoginAccount ⮑ accountCode ⮑ resetPassword</text>
  </g>

  <!-- ===== 2 CATALOGUE ===== -->
  <g>
    <rect x="30" y="355" width="700" height="150" rx="10" fill="#f3e5f5" stroke="#8e24aa" stroke-width="1.5"/>
    <text x="45" y="379" font-size="15" font-weight="700" fill="#6a1b9a">2 · Catalog (families → offers → products)</text>
    <rect x="48" y="395" width="150" height="42" rx="6" fill="#fff" stroke="#8e24aa"/>
    <text x="58" y="412" font-size="11.5" fill="#6a1b9a">GET /family/</text>
    <text x="58" y="428" font-size="11.5" fill="#6a1b9a">findParentFamilies</text>
    <rect x="238" y="395" width="150" height="42" rx="6" fill="#fff" stroke="#8e24aa"/>
    <text x="248" y="412" font-size="11.5" fill="#6a1b9a">GET /offer/</text>
    <text x="248" y="428" font-size="11.5" fill="#6a1b9a">findOfferCodesByFamily</text>
    <rect x="428" y="395" width="140" height="42" rx="6" fill="#fff" stroke="#8e24aa"/>
    <text x="438" y="412" font-size="11.5" fill="#6a1b9a">GET /product/</text>
    <text x="438" y="428" font-size="11.5" fill="#6a1b9a">findProductCodes</text>
    <rect x="598" y="395" width="118" height="42" rx="6" fill="#fff" stroke="#8e24aa"/>
    <text x="608" y="412" font-size="11.5" fill="#6a1b9a">GET /product/</text>
    <text x="608" y="428" font-size="11.5" fill="#6a1b9a">readProduct</text>
    <line x1="198" y1="416" x2="238" y2="416" stroke="#e65100" stroke-width="2.5" stroke-dasharray="5 3" marker-end="url(#arrData)"/>
    <text x="150" y="388" font-size="10.5" fill="#e65100">familyCode</text>
    <line x1="388" y1="416" x2="428" y2="416" stroke="#e65100" stroke-width="2.5" stroke-dasharray="5 3" marker-end="url(#arrData)"/>
    <text x="345" y="388" font-size="10.5" fill="#e65100">offerCode</text>
    <line x1="568" y1="416" x2="598" y2="416" stroke="#e65100" stroke-width="2.5" stroke-dasharray="5 3" marker-end="url(#arrData)"/>
    <text x="520" y="388" font-size="10.5" fill="#e65100">productCodes</text>
    <text x="48" y="470" font-size="11.5" fill="#8e24aa">offerCode also feeds readOffer + the calendar (flow 3)</text>
    <text x="48" y="490" font-size="11" fill="#9c7aa8">hidden variants: Gate*Cached</text>
  </g>

  <!-- ===== 3 CALENDAR ===== -->
  <g>
    <rect x="760" y="200" width="710" height="150" rx="10" fill="#fff3e0" stroke="#fb8c00" stroke-width="1.5"/>
    <text x="775" y="224" font-size="15" font-weight="700" fill="#e65100">3 · Calendar (days → slots → quotas)</text>
    <rect x="778" y="240" width="150" height="42" rx="6" fill="#fff" stroke="#fb8c00"/>
    <text x="788" y="257" font-size="11.5" fill="#e65100">GET /offer/</text>
    <text x="788" y="273" font-size="11" fill="#607d8b">findFirstAvailableDate</text>
    <rect x="968" y="240" width="150" height="42" rx="6" fill="#fff" stroke="#fb8c00"/>
    <text x="978" y="257" font-size="11.5" fill="#e65100">GET /performance/</text>
    <text x="978" y="273" font-size="11" fill="#607d8b">findCalendarDays</text>
    <rect x="1158" y="240" width="150" height="42" rx="6" fill="#fff" stroke="#fb8c00"/>
    <text x="1168" y="257" font-size="11.5" fill="#e65100">GET /performance/</text>
    <text x="1168" y="273" font-size="11" fill="#607d8b">findPerformanceByDay</text>
    <rect x="968" y="296" width="150" height="42" rx="6" fill="#fff" stroke="#fb8c00"/>
    <text x="978" y="313" font-size="11.5" fill="#e65100">GET /performance/</text>
    <text x="978" y="329" font-size="11" fill="#607d8b">findQuotaByPerformance</text>
    <line x1="928" y1="261" x2="968" y2="261" stroke="#e65100" stroke-width="2.5" stroke-dasharray="5 3" marker-end="url(#arrData)"/>
    <text x="900" y="233" font-size="10.5" fill="#e65100">date</text>
    <line x1="1118" y1="261" x2="1158" y2="261" stroke="#e65100" stroke-width="2.5" stroke-dasharray="5 3" marker-end="url(#arrData)"/>
    <text x="1095" y="233" font-size="10.5" fill="#e65100">date</text>
    <line x1="1233" y1="282" x2="1233" y2="300" stroke="#e65100" stroke-width="2.5" stroke-dasharray="5 3"/>
    <line x1="1233" y1="300" x2="1120" y2="312" stroke="#e65100" stroke-width="2.5" stroke-dasharray="5 3" marker-end="url(#arrData)"/>
    <text x="1150" y="300" font-size="10.5" fill="#e65100">performanceCode</text>
  </g>

  <!-- ===== 4 PURCHASE FUNNEL ===== -->
  <g>
    <rect x="30" y="540" width="1440" height="190" rx="10" fill="#e8f5e9" stroke="#43a047" stroke-width="2"/>
    <text x="45" y="566" font-size="16" font-weight="700" fill="#2e7d32">4 · Purchase funnel (core journey)</text>

    <rect x="48" y="585" width="120" height="46" rx="6" fill="#fff" stroke="#43a047"/>
    <text x="58" y="604" font-size="11.5" fill="#2e7d32">POST /sell/</text>
    <text x="58" y="620" font-size="11.5" fill="#2e7d32">upSell · crossSell</text>

    <rect x="228" y="585" width="140" height="46" rx="6" fill="#fff" stroke="#43a047"/>
    <text x="238" y="604" font-size="11.5" fill="#2e7d32">POST /cart/checkCart</text>
    <text x="238" y="620" font-size="11" fill="#607d8b">(cartCode)</text>

    <rect x="428" y="585" width="170" height="46" rx="6" fill="#fff" stroke="#43a047" stroke-width="2"/>
    <text x="438" y="604" font-size="11.5" fill="#2e7d32" font-weight="600">POST /order/beginOrderTrans</text>
    <text x="438" y="620" font-size="11" fill="#e65100">(cartCode) → orderCode</text>

    <rect x="658" y="585" width="150" height="46" rx="6" fill="#fffde7" stroke="#fbc02d" stroke-width="1.5"/>
    <text x="668" y="604" font-size="11.5" fill="#9e7d00">PSP payment</text>
    <text x="668" y="620" font-size="11" fill="#9e7d00">(outside backoffice)</text>

    <rect x="868" y="585" width="180" height="46" rx="6" fill="#fff" stroke="#43a047" stroke-width="2"/>
    <text x="878" y="604" font-size="11.5" fill="#2e7d32" font-weight="600">POST /order/confirmOrderTrans</text>
    <text x="878" y="620" font-size="11" fill="#607d8b">(orderCode, payments)</text>

    <rect x="1108" y="585" width="160" height="46" rx="6" fill="#fff" stroke="#43a047"/>
    <text x="1118" y="604" font-size="11.5" fill="#2e7d32">GET /order/readOrderDetails</text>
    <text x="1118" y="620" font-size="11" fill="#607d8b">(orderCode)</text>

    <!-- seq arrows -->
    <line x1="168" y1="608" x2="228" y2="608" stroke="#455a64" stroke-width="2" marker-end="url(#arr)"/>
    <line x1="368" y1="608" x2="428" y2="608" stroke="#455a64" stroke-width="2" marker-end="url(#arr)"/>
    <line x1="598" y1="608" x2="658" y2="608" stroke="#455a64" stroke-width="2" marker-end="url(#arr)"/>
    <line x1="808" y1="608" x2="868" y2="608" stroke="#455a64" stroke-width="2" marker-end="url(#arr)"/>
    <line x1="1048" y1="608" x2="1108" y2="608" stroke="#455a64" stroke-width="2" marker-end="url(#arr)"/>

    <!-- data chain orderCode arc -->
    <path d="M513,585 C513,560 790,560 940,560 L958,585" fill="none" stroke="#e65100" stroke-width="2.5" stroke-dasharray="5 3" marker-end="url(#arrData)"/>
    <text x="690" y="553" font-size="11" fill="#e65100" font-weight="600">orderCode (= paymentTrx.saleAk)</text>

    <text x="48" y="662" font-size="11.5" fill="#2e7d32">cartCode = cart pivot (checkCart + beginOrderTrans + removeCart)</text>
    <text x="48" y="682" font-size="11" fill="#66926a">numbered seats option: POST /seat/bestSeat (holdSeat) before the cart</text>
    <text x="48" y="702" font-size="11" fill="#66926a">cancellation: POST /order/cancelOrderTrans · DELETE /cart/removeCart</text>
    <text x="1108" y="662" font-size="11" fill="#e65100">saleAk / mediaCode ⮑ documents (flow 7)</text>
  </g>

  <!-- ===== 5 UPGRADE/RENEW ===== -->
  <g>
    <rect x="30" y="755" width="440" height="120" rx="10" fill="#fce4ec" stroke="#d81b60" stroke-width="1.5"/>
    <text x="45" y="779" font-size="15" font-weight="700" fill="#ad1457">5 · Upgrade / Renewal</text>
    <rect x="48" y="793" width="180" height="42" rx="6" fill="#fff" stroke="#d81b60"/>
    <text x="58" y="810" font-size="11.5" fill="#ad1457">POST /cart/tryExchange</text>
    <text x="58" y="826" font-size="11" fill="#607d8b">/ tryRenewal (simulation)</text>
    <rect x="268" y="793" width="180" height="42" rx="6" fill="#fff" stroke="#d81b60"/>
    <text x="278" y="810" font-size="11.5" fill="#ad1457">POST /order/exchangeTrans</text>
    <text x="278" y="826" font-size="11" fill="#607d8b">/ renewalTrans → orderCode</text>
    <line x1="228" y1="814" x2="268" y2="814" stroke="#e65100" stroke-width="2.5" stroke-dasharray="5 3" marker-end="url(#arrData)"/>
    <text x="40" y="868" font-size="11" fill="#ad1457">cypherCartCode ⮑ (decrypted) cartCode ⮑ then payment + confirmOrderTrans (flow 4)</text>
  </g>

  <!-- ===== 6 CUSTOMER AREA ===== -->
  <g>
    <rect x="500" y="755" width="470" height="120" rx="10" fill="#ede7f6" stroke="#5e35b1" stroke-width="1.5"/>
    <text x="515" y="779" font-size="15" font-weight="700" fill="#4527a0">6 · Customer area (account / allocations)</text>
    <rect x="518" y="793" width="200" height="42" rx="6" fill="#fff" stroke="#5e35b1"/>
    <text x="528" y="810" font-size="11.5" fill="#4527a0">POST /account/</text>
    <text x="528" y="826" font-size="11" fill="#607d8b">searchNotAllocatedTickets</text>
    <rect x="758" y="793" width="190" height="42" rx="6" fill="#fff" stroke="#5e35b1"/>
    <text x="768" y="810" font-size="11.5" fill="#4527a0">POST /account/createAllocation</text>
    <text x="768" y="826" font-size="11" fill="#607d8b">(ticketCodes)</text>
    <line x1="718" y1="814" x2="758" y2="814" stroke="#e65100" stroke-width="2.5" stroke-dasharray="5 3" marker-end="url(#arrData)"/>
    <text x="700" y="786" font-size="10.5" fill="#e65100">ticketCodes</text>
    <text x="515" y="868" font-size="11" fill="#4527a0">readAccount.accountCode ⮑ searchOrder (order list)</text>
  </g>

  <!-- ===== 7 DOCUMENTS ===== -->
  <g>
    <rect x="1000" y="755" width="470" height="120" rx="10" fill="#e0f2f1" stroke="#00897b" stroke-width="1.5"/>
    <text x="1015" y="779" font-size="15" font-weight="700" fill="#00695c">7 · Documents / tickets</text>
    <rect x="1018" y="793" width="200" height="42" rx="6" fill="#fff" stroke="#00897b"/>
    <text x="1028" y="810" font-size="11.5" fill="#00695c">GET /document/generateDocument</text>
    <text x="1028" y="826" font-size="11" fill="#607d8b">(saleAk)</text>
    <rect x="1248" y="793" width="200" height="42" rx="6" fill="#fff" stroke="#00897b"/>
    <text x="1258" y="810" font-size="11.5" fill="#00695c">GET /ticket/generatePDF</text>
    <text x="1258" y="826" font-size="11" fill="#607d8b">(mediaCode)</text>
    <text x="1015" y="868" font-size="11" fill="#00695c">prerequisite: a confirmed order (flow 4) provides saleAk / mediaCode</text>
  </g>

  <!-- ===== GLOBAL FLOW BAND ===== -->
  <g>
    <rect x="30" y="905" width="1440" height="112" rx="10" fill="#ffffff" stroke="#90a4ae" stroke-width="1.5"/>
    <text x="45" y="930" font-size="14" font-weight="700" fill="#37474f">Nominal purchase sequence (overview)</text>
    <text x="45" y="962" font-size="13" fill="#455a64">
      token → signin → readAccount → family → offer → product → calendar(day→slot→quota) → upSell → checkCart → beginOrderTrans → <tspan fill="#9e7d00">payment</tspan> → confirmOrderTrans → readOrderDetails → documents
    </text>
    <text x="45" y="982" font-size="11" fill="#1565c0">Note: B2B order (login first). In B2C, signin happens AFTER checkCart (see scenario-auth-order.svg).</text>
    <text x="45" y="1000" font-size="11.5" fill="#e65100">Data flowing through: accessToken · accountCode · familyCode · offerCode · productCodes · date · performanceCode · cartCode · orderCode · saleAk</text>
  </g>
</svg>
