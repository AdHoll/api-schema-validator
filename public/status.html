<!DOCTYPE html>
<html lang="fr" class="h-full bg-slate-900">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VivAPI Unified Validator — Statut des APIs</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">

  <div class="w-full max-w-[1400px] mx-auto px-4 sm:px-6 lg:px-8 py-6 flex-grow flex flex-col gap-6">

    <!-- Header + onglets -->
    <header class="border-b border-slate-800 pb-4 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
      <div class="flex items-center gap-4">
        <img src="/logo.svg" alt="VivAPI Unified Validator" class="h-12 sm:h-14 w-auto flex-shrink-0">
      </div>
      <div class="inline-flex rounded-lg border border-slate-700 bg-slate-900/80 p-1 text-xs font-semibold">
        <a href="/index.html" class="px-4 py-1.5 rounded-md transition text-slate-400 hover:text-slate-200">
          <i class="fa-solid fa-list-check mr-1.5"></i> Validateur
        </a>
        <a href="/status.html" class="px-4 py-1.5 rounded-md transition bg-indigo-600 text-white">
          <i class="fa-solid fa-heart-pulse mr-1.5"></i> Statut des APIs
        </a>
      </div>
    </header>

    <!-- SECTION COFFRE BITWARDEN -->
    <section class="bg-slate-800/80 rounded-xl p-5 border border-slate-700/80 shadow-lg space-y-4">
      <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
        <h2 class="text-base font-semibold text-indigo-300 flex items-center gap-2">
          <i class="fa-solid fa-vault"></i> Coffre Bitwarden
        </h2>
        <div class="flex items-center gap-2">
          <button type="button" id="loginTerminalBtn"
            class="text-xs font-semibold px-3 py-1.5 rounded-lg border border-slate-600 bg-slate-800 hover:bg-slate-700 text-slate-200 transition flex items-center gap-1.5"
            title="Ouvre un terminal PowerShell pour configurer le serveur EU et se connecter">
            <i class="fa-solid fa-terminal"></i> Config & connexion (EU)
          </button>
          <div id="vaultStatus" class="text-xs flex items-center gap-2 px-3 py-1.5 rounded-lg border border-slate-700 bg-slate-900/60 text-slate-400">
            <i class="fa-solid fa-lock text-rose-400"></i> <span>Verrouillé</span>
          </div>
        </div>
      </div>

      <form id="unlockForm" class="flex flex-col sm:flex-row gap-3 sm:items-end">
        <div class="flex-1">
          <label class="block text-xs font-medium text-slate-400 mb-1.5" for="masterPassword">Mot de passe maître</label>
          <input type="password" id="masterPassword" autocomplete="current-password"
            class="w-full bg-slate-900/80 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-indigo-500"
            placeholder="Saisi uniquement en mémoire, jamais stocké">
        </div>
        <button type="submit" id="unlockBtn"
          class="py-2 px-5 bg-indigo-600 hover:bg-indigo-500 border border-indigo-500 text-white text-sm font-bold rounded-lg transition flex justify-center items-center gap-2 whitespace-nowrap">
          <i class="fa-solid fa-unlock"></i> Déverrouiller
        </button>
        <button type="button" id="lockBtn"
          class="hidden py-2 px-5 bg-slate-700 hover:bg-slate-600 border border-slate-600 text-slate-200 text-sm font-bold rounded-lg transition flex justify-center items-center gap-2 whitespace-nowrap">
          <i class="fa-solid fa-lock"></i> Verrouiller
        </button>
      </form>
      <p class="text-[11px] text-slate-500 italic">
        <i class="fa-solid fa-shield-halved mr-1"></i>
        Le mot de passe maître n'est jamais stocké ni journalisé. La session expire automatiquement après 15 min d'inactivité.
      </p>
    </section>

    <!-- SECTION APIS -->
    <section class="bg-slate-800/80 rounded-xl p-5 border border-slate-700/80 shadow-lg space-y-4">
      <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center border-b border-slate-700/80 pb-3 gap-2">
        <h2 class="text-base font-semibold text-indigo-300 flex items-center gap-2">
          <i class="fa-solid fa-server"></i> APIs à tester
        </h2>
        <div class="flex items-center gap-2">
          <button type="button" id="addApiBtn"
            class="text-xs font-semibold px-3 py-1.5 rounded-lg border border-slate-600 bg-slate-800 hover:bg-slate-700 text-slate-200 transition flex items-center gap-1.5">
            <i class="fa-solid fa-plus"></i> Ajouter une API
          </button>
          <button type="button" id="testAllBtn"
            class="text-xs font-bold px-3 py-1.5 rounded-lg border border-indigo-500 bg-indigo-600 hover:bg-indigo-500 text-white transition flex items-center gap-1.5">
            <i class="fa-solid fa-play"></i> Tout tester
          </button>
        </div>
      </div>

      <!-- Filtres par tag -->
      <div id="tagFilters" class="flex flex-wrap items-center gap-2 text-xs"></div>

      <!-- Liste des APIs -->
      <div id="apiList" class="space-y-2">
        <div class="text-slate-500 italic text-center py-6">Aucune API configurée. Cliquez sur « Ajouter une API ».</div>
      </div>
    </section>

  </div>

  <!-- MODAL AJOUT/ÉDITION API -->
  <div id="apiModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-700 rounded-xl shadow-2xl w-full max-w-lg">
      <div class="bg-slate-800/90 px-6 py-4 border-b border-slate-700 flex justify-between items-center">
        <h3 id="apiModalTitle" class="text-sm font-bold text-slate-100">Ajouter une API</h3>
        <button type="button" id="closeApiModalBtn" class="text-slate-400 hover:text-slate-100 p-1"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>
      <div class="p-6 space-y-3 text-xs">
        <div>
          <label class="block font-medium text-slate-400 mb-1">Libellé</label>
          <input type="text" id="fLabel" class="w-full bg-slate-900/80 border border-slate-700 rounded-md px-2.5 py-1.5 text-slate-200 focus:outline-none focus:border-indigo-500" placeholder="Vision Dev FR">
        </div>
        <div>
          <label class="block font-medium text-slate-400 mb-1">Propriétaire (organisation Bitwarden)</label>
          <input type="text" id="fOwner" class="w-full bg-slate-900/80 border border-slate-700 rounded-md px-2.5 py-1.5 text-slate-200 focus:outline-none focus:border-indigo-500" placeholder="Laisser vide pour le coffre personnel">
        </div>
        <div>
          <label class="block font-medium text-slate-400 mb-1">Collection Bitwarden</label>
          <input type="text" id="fCollection" class="w-full bg-slate-900/80 border border-slate-700 rounded-md px-2.5 py-1.5 text-slate-200 focus:outline-none focus:border-indigo-500" placeholder="Optionnel">
        </div>
        <div>
          <label class="block font-medium text-slate-400 mb-1">Nom de l'entrée Bitwarden</label>
          <input type="text" id="fItemName" class="w-full bg-slate-900/80 border border-slate-700 rounded-md px-2.5 py-1.5 text-slate-200 focus:outline-none focus:border-indigo-500" placeholder="API Vision Dev FR">
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block font-medium text-slate-400 mb-1">Scope</label>
            <select id="fScope" class="w-full bg-slate-900/80 border border-slate-700 rounded-md px-2.5 py-1.5 text-slate-200 focus:outline-none focus:border-indigo-500">
              <option value="b2c">b2c</option>
              <option value="b2b">b2b</option>
            </select>
          </div>
          <div>
            <label class="block font-medium text-slate-400 mb-1">Environnement (tag)</label>
            <select id="fTag" class="w-full bg-slate-900/80 border border-slate-700 rounded-md px-2.5 py-1.5 text-slate-200 focus:outline-none focus:border-indigo-500">
              <option value="Prod">Prod</option>
              <option value="Préprod">Préprod</option>
              <option value="QA">QA</option>
              <option value="Dev">Dev</option>
              <option value="Demo">Demo</option>
            </select>
          </div>
        </div>
      </div>
      <div class="bg-slate-800/50 px-6 py-3 border-t border-slate-700/80 flex justify-end gap-2">
        <button type="button" id="cancelApiBtn" class="px-4 py-1.5 bg-slate-700 hover:bg-slate-600 text-slate-200 text-xs font-semibold rounded-lg transition">Annuler</button>
        <button type="button" id="saveApiBtn" class="px-4 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold rounded-lg transition">Enregistrer</button>
      </div>
    </div>
  </div>

  <!-- MODAL DÉTAIL RÉPONSE -->
  <div id="detailModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-700 rounded-xl shadow-2xl w-full max-w-3xl max-h-[85vh] flex flex-col overflow-hidden">
      <div class="bg-slate-800/90 px-6 py-4 border-b border-slate-700 flex justify-between items-center">
        <h3 id="detailTitle" class="text-sm font-bold text-slate-100 font-mono"></h3>
        <button type="button" id="closeDetailBtn" class="text-slate-400 hover:text-slate-100 p-1"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>
      <div class="p-6 overflow-y-auto">
        <pre id="detailBody" class="bg-slate-950 border border-slate-800 rounded-lg p-4 font-mono text-[11px] text-sky-300 overflow-auto whitespace-pre-wrap break-all"></pre>
      </div>
    </div>
  </div>

  <script src="/status.js"></script>
</body>
</html>
