openapi: 3.0.3
info:
  title: Unified backoffice API
  version: 1.8.1
  description: Unified back office API for Vivaticket ticket sales management
    We decided to use meaningful, service-oriented names.
    For the get api we decided to use find, read and search as prefix for our APIs.
    Read -> returns an entity starting from a code. For performance reasons, this type of API allows user to make a group of calls by passing more than one parameter
    Find -> returns multiple entities starting from one or more request parameters
    Search -> same as Find, but the response supports the pagination

  contact:
    name: VivaTicket
    email: info@vivaticket.com
tags:
  - name: account
  - name: asset # static assets, such as images
  - name: auth # services relating to authentication
  - name: cart
  - name: document
  - name: family
  - name: mask # configurations relating to the user's data entry masks
  - name: offer
  - name: order
  - name: performance
  - name: price
  - name: product
  - name: renewal
  - name: report
  - name: seat
  - name: sell
  - name: ticket
  - name: upgrade
  - name: cache

security:
  - BearerAuth: [ ]

paths:
  # ==================================================
  # ENDPOINTS GROUP: ACCOUNT
  # ==================================================

  /api/v1/account/createAccount:
    post:
      tags:
        - account
      summary: create a new account
      operationId: createAccount
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAccountReq"
      responses:
        200:
          description: Ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateAccountRes"
        400:
          $ref: "#/components/responses/BadRequestResponse"
        401:
          $ref: "#/components/responses/NotAuthenticatedResponse"
        404:
          $ref: "#/components/responses/NotFoundResponse"
        500:
          $ref: "#/components/responses/InternalServerErrorResponse"

  /api/v1/account/readAccount:
    get:
      tags:
        - account
      summary: Read account  by code
      operationId: readAccount
      parameters:
        - in: query
          name: accountCode
          required: true
          description: List of account code
          schema:
            type: array
            items:
              type: string

      responses:
        200:
          description: Ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadAccountRes"
        400:
          $ref: "#/components/responses/BadRequestResponse"
        401:
          $ref: "#/components/responses/NotAuthenticatedResponse"
        404:
          $ref: "#/components/responses/NotFoundResponse"
        500:
          $ref: "#/components/responses/InternalServerErrorResponse"

  /api/v1/account/readAccountFinancial:
    get:
      tags:
        - account
      summary: Read account financial by code
      operationId: readAccountFinancial
      parameters:
        - in: query
          name: accountCode
          required: true
          description: List of account code
          schema:
            type: array
            items:
              type: string

      responses:
        200:
          description: Ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadAccountFinancialRes"
        400:
          $ref: "#/components/responses/BadRequestResponse"
        401:
          $ref: "#/components/responses/NotAuthenticatedResponse"
        404:
          $ref: "#/components/responses/NotFoundResponse"
        500:
          $ref: "#/components/responses/InternalServerErrorResponse"

  /api/v1/account/updateAccount:
    patch:
      tags:
        - account
      summary: update account
      operationId: updateAccount
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAccountReq"
      responses:
        200:
          description: Ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateAccountRes"
        400:
          $ref: "#/components/responses/BadRequestResponse"
        401:
          $ref: "#/components/responses/NotAuthenticatedResponse"
        404:
          $ref: "#/components/responses/NotFoundResponse"
        500:
          $ref: "#/components/responses/InternalServerErrorResponse"

  /api/v1/account/searchAccount:
    post:
      tags:
        - account
      summary: search account
      operationId: searchAccount
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchAccountReq"
      responses:
        200:
          description: Ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchAccountRes"
        400:
          $ref: "#/components/responses/BadRequestResponse"
        401:
          $ref: "#/components/responses/NotAuthenticatedResponse"
        404:
          $ref: "#/components/responses/NotFoundResponse"
        500:
          $ref: "#/components/responses/InternalServerErrorResponse"

  /api/v1/account/searchAccountCredit:
    post:
      tags:
        - account
      summary: search account credit
      operationId: searchAccountCredit
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchAccountCreditReq"
      responses:
        200:
          description: Ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchAccountCreditRes"
        400:
          $ref: "#/components/responses/BadRequestResponse"
        401:
          $ref: "#/components/responses/NotAuthenticatedResponse"
        404:
          $ref: "#/components/responses/NotFoundResponse"
        500:
          $ref: "#/components/responses/InternalServerErrorResponse"

  /api/v1/account/accountCreditRecharge:
    post:
      tags:
        - account
      summary: account credit recharge
      operationId: accountCreditRecharge
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountCreditRechargeReq"
      responses:
        200:
          description: Ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountCreditRechargeRes"
        400:
          $ref: "#/components/responses/BadRequestResponse"
        401:
          $ref: "#/components/responses/NotAuthenticatedResponse"
        404:
          $ref: "#/components/responses/NotFoundResponse"
        500:
          $ref: "#/components/responses/InternalServerErrorResponse"

  /api/v1/account/checkCreditAccount:
    post:
      tags:
        - account
      summary: check credit account
      operationId: checkCreditAccount
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckCreditAccountReq"
      responses:
        200:
          description: Ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckCreditAccountRes"
        400:
          $ref: "#/components/responses/BadRequestResponse"
        401:
          $ref: "#/components/responses/NotAuthenticatedResponse"
        404:
          $ref: "#/components/responses/NotFoundResponse"
        500:
          $ref: "#/components/responses/InternalServerErrorResponse"

  # ==================================================
  # ENDPOINTS GROUP: ASSET
  # ==================================================
  /api/v1/asset/readImage:
    get:
      tags:
        - asset
      summary: Read image list by code
      operationId: readImage
      parameters:
        - in: query
          name: imageCode
          required: true
          description: List of image code
          schema:
            type: array
            items:
              type: string

      responses:
        200:
          description: Ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadImageRes"
        400:
          $ref: "#/components/responses/BadRequestResponse"
        401:
          $ref: "#/components/responses/NotAuthenticatedResponse"
        404:
          $ref: "#/components/responses/NotFoundResponse"
        500:
          $ref: "#/components/responses/InternalServerErrorResponse"

  /api/v1/asset/createImage:
    post:
      tags:
        - asset
      summary: Create image
      operationId: createImage
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateImageReq"
      responses:
        200:
          description: Ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateImageRes"
        400:
          $ref: "#/components/responses/BadRequestResponse"
        401:
          $ref: "#/components/responses/NotAuthenticatedResponse"
        500:
          $ref: "#/components/responses/InternalServerErrorResponse"

  # ==================================================
  # ENDPOINTS GROUP: AUTH
  # ==================================================
  /api/v1/auth/signin:
    post:
      tags:
        - auth
      summary: signin
      description: BOS https://vivaticket.atlassian.net/wiki/spaces/BD31/pages/9017450/AccountLogIn
      operationId: signin
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SigninReq"
      responses:
        # ErrorCode: ACCOUNT.2 - ACCOUNT.5 - ACCOUNT.6 - ACCOUNT.7

        200:
          description: Ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SigninRes"
        400:
          $ref: "#/components/responses/BadRequestResponse"
        401:
          $ref: "#/components/responses/NotAuthenticatedResponse"
        500:
          $ref: "#/components/responses/InternalServerErrorResponse"

  /api/v1/auth/changePassword:
    post:
      tags:
        - auth
      summary: Change password
      description: Vision /api/customers/updatePassword
      operationId: changePassword
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordReq"
      responses:
        200:
          description: Ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangePasswordRes"
        400:
          $ref: "#/components/responses/BadRequestResponse"
        401:
          $ref: "#/components/responses/NotAuthenticatedResponse"
        404:
          $ref: "#/components/responses/NotFoundResponse"
        500:
          $ref: "#/components/responses/InternalServerErrorResponse"

  /api/v1/auth/searchLoginAccount: #TODO rename in find
    get:
      tags:
        - auth
      summary: Search active login account by email and return minimal data
      operationId: SearchLoginAccount
      parameters:
        - in: query
          name: value
          required: true
          description: Value to use for search account. Default is email address
          schema:
            type: string
        - in: query
          name: fieldCode
          description: Specify the search field if different from email
          schema:
            $ref: "#/components/schemas/FieldCodeType"
        - in: query
          name: bosAccountCategoryCode
          schema:
            type: string
      responses:
        # ErrorCode: ACCOUNT.2

        200:
          description: Ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchLoginAccountRes"

        400:
          $ref: "#/components/responses/BadRequestResponse"
        401:
          $ref: "#/components/responses/NotAuthenticatedResponse"
        404:
          $ref: "#/components/responses/NotFoundResponse"
        500:
          $ref: "#/components/responses/InternalServerErrorResponse"

  /api/v1/auth/resetPassword:
    post:
      tags:
        - auth
      summary: Change password
      description: Vision /api/customers/reinitializePassword
      operationId: resetPassword
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordReq"
      responses:
        # ErrorCode: ACCOUNT.66

        200:
          description: Ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResetPasswordRes"
        400:
          $ref: "#/components/responses/BadRequestResponse"
        401:
          $ref: "#/components/responses/NotAuthenticatedResponse"
        404:
          $ref: "#/components/responses/NotFoundResponse"
        500:
          $ref: "#/components/responses/InternalServerErrorResponse"

  # ==================================================
  # ENDPOINTS GROUP: CART
  # ==================================================

  /api/v1/cart/checkCart:
    post:
      tags:
        - cart
      summary: Check cart
      description: BOS https://vivaticket.atlassian.net/wiki/spaces/BD31/pages/9018236/CheckBasket
      operationId: checkCart
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckCartReq"
      responses:
        # ErrorCode: COUPON.0 - COUPON.2 - PERFORMANCE.1

        200:
          description: Ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckCartRes"
        400:
          $ref: "#/components/responses/BadRequestResponse"
        401:
          $ref: "#/components/responses/NotAuthenticatedResponse"
        404:
          $ref: "#/components/responses/NotFoundResponse"
        500:
          $ref: "#/components/responses/InternalServerErrorResponse"

  /api/v1/cart/tryExchange:
    post:
      tags:
        - cart
      summary: try exchange
      description: BOS https://vivaticket.atlassian.net/wiki/spaces/BD31/pages/9018396/TryUpgrade
      operationId: tryExchange
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TryExchangeReq"
      responses:
        # ErrorCode : TICKET.08 - TICKET.10

        200:
          description: Ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TryExchangeRes"
        400:
          $ref: "#/components/responses/BadRequestResponse"
        401:
          $ref: "#/components/responses/NotAuthenticatedResponse"
        404:
          $ref: "#/components/responses/NotFoundResponse"
        500:
          $ref: "#/components/responses/InternalServerErrorResponse"

  /api/v1/cart/tryRenewal:
    post:
      tags:
        - cart
      summary: try renewal
      description: BOS https://vivaticket.atlassian.net/wiki/spaces/BD31/pages/9018396/TryRenew
      operationId: tryRenewal
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TryRenewalReq"
      responses:
        # ErrorCode: TICKET.105 - TICKET.111

        200:
          description: Ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TryRenewalRes"
        400:
          $ref: "#/components/responses/BadRequestResponse"
        401:
          $ref: "#/components/responses/NotAuthenticatedResponse"
        404:
          $ref: "#/components/responses/NotFoundResponse"
        500:
          $ref: "#/components/responses/InternalServerErrorResponse"

  /api/v1/cart/removeCart:
    delete:
      tags:
        - cart
      summary: Empty cart. This API can only be called if a checkCart has been executed
      operationId: removeCart
      parameters:
        - in: query
          name: cartCode
          description: code of the cart to empty
          required: true
          schema:
            type: string
      responses:
        204:
          description: Ok
        400:
          $ref: "#/components/responses/BadRequestResponse"
        401:
          $ref: "#/components/responses/NotAuthenticatedResponse"
        404:
          $ref: "#/components/responses/NotFoundResponse"
        500:
          $ref: "#/components/responses/InternalServerErrorResponse"

  # ==================================================
  # ENDPOINTS - CONTACTS
  # ==================================================
  /api/v1/account/manageAccountRelationship:
    delete:
      tags:
        - account
      summary: manage relationships between accounts
      description: manage relationships
      operationId: manageAccountRelationship
      parameters:
        - in: query
          name: sourceAccountCode
          description: contact account code
          required: true
          schema:
            type: string
        - in: query
          name: targetAccountCode
          description: account code logged user
          required: true
          schema:
            type: string
        - in: query
          name: operationType
          required: true
          schema:
            $ref: "#/components/schemas/AccountRelationshipOperationEnum"
      responses:
        204:
          description: OK
        400:
          $ref: "#/components/responses/BadRequestResponse"
        401:
          $ref: "#/components/responses/NotAuthenticatedResponse"
        404:
          $ref: "#/components/responses/NotFoundResponse"
        500:
          $ref: "#/components/responses/InternalServerErrorResponse"
  # ==================================================
  # ENDPOINTS GROUP: FAMILY
  # ==================================================
  /api/v1/family/findParentFamilies:
    get:
      tags:
        - family
      summary: Find all parent family codes given a code
      operationId: findParentFamilies
      parameters:
        - $ref: "#/components/parameters/locale.query"
        - in: query
          name: code
          description: "If core system haven't different parent family groups, it can be used a conventional code: 'default'"
          required: true
          schema:
            type: array
            items:
              type: string
        - in: query
          name: accountCode
          description: "It allows to filter the retrieved families by logged user, for future use"
          required: false
          schema:
            type: string
      responses:
        200:
          description: Ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FindParentFamiliesRes"
        400:
          $ref: "#/components/responses/BadRequestResponse"
        401:
          $ref: "#/components/responses/NotAuthenticatedResponse"
        500:
          $ref: "#/components/responses/InternalServerErrorResponse"

  /api/v1/family/readParentFamily:
    get:
      tags:
        - family
      summary: Read parent family given a parent family code
      operationId: readParentFamily
      parameters:
        - $ref: "#/components/parameters/locale.query"
        - in: query
          name: parentFamilyCode
          required: true
          schema:
            type: array
            items:
              type: string
        - in: query
          name: accountCode
          description: "It allows to filter the retrieved families by logged user, for future use"
          required: false
          schema:
            type: string
      responses:
        200:
          description: Ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadParentFamilyRes"
        400:
          $ref: "#/components/responses/BadRequestResponse"
        401:
          $ref: "#/components/responses/NotAuthenticatedResponse"
        500:
          $ref: "#/components/responses/InternalServerErrorResponse"

  /api/v1/family/readFamily:
    get:
      tags:
        - family
      summary: Read family given a family code
      operationId: readFamily
      parameters:
        - $ref: "#/components/parameters/locale.query"
        - in: query
          name: familyCode
          required: true
          schema:
            type: array
            items:
              type: string
        - in: query
          name: accountCode
          description: "It allows to filter the retrieved families by logged user, for future use"
          required: false
          schema:
            type: string
        - in: query
          name: askThemeCode
          required: false
          description: "Request the default theme code associated to the family"
          schema:
            type: boolean
      responses:
        200:
          description: Ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadFamilyRes"
        400:
          $ref: "#/components/responses/BadRequestResponse"
        401:
          $ref: "#/components/responses/NotAuthenticatedResponse"
        500:
          $ref: "#/components/responses/InternalServerErrorResponse"

  /api/v1/family/readTheme:
    get:
      tags:
        - family
      summary: Read theme for the family code
      operationId: readTheme
      parameters:
        - $ref: "#/components/parameters/locale.query"
        - in: query
          name: themeCode
          required: true
          schema:
            type: string
      responses:
        200:
          description: Ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadThemeRes"
        400:
          $ref: "#/components/responses/BadRequestResponse"
        401:
          $ref: "#/components/responses/NotAuthenticatedResponse"
        500:
          $ref: "#/components/responses/InternalServerErrorResponse"

  # ==================================================
  # ENDPOINTS GROUP: MASK
  # ==================================================
  /api/v1/mask/readDataList:
    get:
      tags:
        - mask
      summary: Read datalist by code
      operationId: readDataList
      parameters:
        - $ref: "#/components/parameters/locale.query"
        - in: query
          name: key
          required: true
          schema:
            type: array
            items:
              $ref: "#/components/schemas/DataListKeyCompactType"

      responses:
        200:
          description: Ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadDataListRes"
        400:
          $ref: "#/components/responses/BadRequestResponse"
        401:
          $ref: "#/components/responses/NotAuthenticatedResponse"
        404:
          $ref: "#/components/responses/NotFoundResponse"
        500:
          $ref: "#/components/responses/InternalServerErrorResponse"

  /api/v1/mask/readMaskCategory:
    get:
      tags:
        - mask
      summary: read mask category (as account category)
      operationId: readMaskCategory
      parameters:
        - $ref: "#/components/parameters/locale.query"
        - in: query
          name: maskCategoryCode
          required: true
          schema:
            type: string

      responses:
        200:
          description: Ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadMaskCategoryRes"
        400:
          $ref: "#/components/responses/BadRequestResponse"
        401:
          $ref: "#/components/responses/NotAuthenticatedResponse"
        404:
          $ref: "#/components/responses/NotFoundResponse"
        500:
          $ref: "#/components/responses/InternalServerErrorResponse"
  # ==================================================
  # ENDPOINTS GROUP: OFFER
  # ==================================================
  /api/v1/offer/findOfferCodesByFamily:
    get:
      tags:
        - offer
      summary: Read offer codes by family code
      operationId: findOfferCodesByFamily
      parameters:
        - in: query
          name: familyCode
          required: true
          description: List of family code
          schema:
            type: array
            items:
              type: string
        - in: query
          name: accountCode
          required: false
          schema:
            type: string
        - in: query
          name: askIsFamilySoldOut
          required: false
          description: Fill "isFamilySoldOut" field in the response with true if every single family offer availability is sold-out
          schema:
            type: boolean

      responses:
        200:
          description: Ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FindOfferCodesByFamilyRes"
        400:
          $ref: "#/components/responses/BadRequestResponse"
        401:
          $ref: "#/components/responses/NotAuthenticatedResponse"
        404:
          $ref: "#/components/responses/NotFoundResponse"
        500:
          $ref: "#/components/responses/InternalServerErrorResponse"

  /api/v1/offer/readOffer:
    get:
      tags:
        - offer
      summary: Read offer data by offer code
      operationId: readOffer
      parameters:
        - $ref: "#/components/parameters/locale.query"
        - in: query
          name: offerCode
          required: true
          description: List of offer code
          schema:
            type: array
            items:
              type: string
        - in: query
          name: askThemeCode
          required: false
          description: Request the theme code list
          schema:
            type: boolean
        - in: query
          name: askDeliveryLanguageCode
          required: false
          description: Request the DeliveryLanguage code. Ex. for guided visits it indicates the languages they will be done.
          schema:
            type: boolean
        - in: query
          name: familyThemeCode
          required: false
          description: Family theme code to use to get theme data to use to overwrite original offer data
          schema:
            type: string

      responses:
        200:
          description: Ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadOfferRes"
        400:
          $ref: "#/components/responses/BadRequestResponse"
        401:
          $ref: "#/components/responses/NotAuthenticatedResponse"
        404:
          $ref: "#/components/responses/NotFoundResponse"
        500:
          $ref: "#/components/responses/InternalServerErrorResponse"

  # ==================================================
  # ENDPOINTS GROUP: ORDER
  # ==================================================
  /api/v1/order/beginOrderTrans:
    post:
      tags:
        - order
      summary: Begin order transaction. Must be followed by cancelOrderTrans or confirmOrderTrans
      description: BOS https://vivaticket.atlassian.net/wiki/spaces/BD31/pages/9018240/CheckOut
      operationId: beginOrderTrans
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BeginOrderTransReq"
      responses:
        # ErrorCode: COUPON.0 - COUPON.2

        200:
          description: Ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BeginOrderTransRes"
        400:
          $ref: "#/components/responses/BadRequestResponse"
        401:
          $ref: "#/components/responses/NotAuthenticatedResponse"
        404:
          $ref: "#/components/responses/NotFoundResponse"
        500:
          $ref: "#/components/responses/InternalServerErrorResponse"

  /api/v1/order/cancelOrderTrans:
    post:
      tags:
        - order
      summary: Cancel order transaction
      description: BOS https://vivaticket.atlassian.net/wiki/spaces/BD31/pages/9018176/AbortSale
      operationId: cancelOrderTrans
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelOrderTransReq"
