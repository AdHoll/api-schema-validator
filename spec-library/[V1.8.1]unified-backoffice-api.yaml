          $ref: "#/components/schemas/MaskFieldValidationFormatEnum"
        displayFormat:
          type: string
          description: The must follow this format
          example: dd/mm/yyyy 23/10/16(x) 23/10/2016(v)
        minLength:
          type: integer
          description: Min length of the field
          example: minLength=4 Win(x) Moon(v) Beach(v) Ticket(v)
        maxLength:
          type: integer
          description: Max length of the field
          example: maxLength=4 Win(v) Moon(v) Beach(x) Ticket(x)
