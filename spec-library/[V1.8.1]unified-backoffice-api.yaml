          $ref: "#/components/responses/InternalServerErrorResponse"

components:
  # ==================================================
  # PARAMETERS - REQUEST
  # ==================================================
  parameters:
    locale.query:
      in: query
      name: locale
      description: Language (and country) code, such as 'en' or 'en-US'
      required: true
      schema:
        type: array
        items:
          type: string

    dateFrom.query:
      in: query
      name: dateFrom
      required: true
      schema:
        type: string

    dateTo.query:
      in: query
      name: dateTo
      required: true
      schema:
        type: string

    timeFrom.query:
      in: query
      name: timeFrom
      schema:
        type: string

    timeTo.query:
      in: query
      name: timeTo
      schema:
        type: string

  # ==================================================
  # SECURITY SCHEMES
  # ==================================================
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer

  schemas:
    # ==================================================
    # COMMON
    # ==================================================
    Locales:
      type: object
      description: Language (and country) code, such as 'en' or 'en-US'
      required:
        - locale
      properties:
        locale:
          type: array
          items:
            $ref: "#/components/schemas/LocaleType"

    # ==================================================
    # REQUEST GROUP: ACCOUNT
    # ==================================================

    CreateAccountReq:
      type: object
      required:
        - accountData
      properties:
        accountData:
          $ref: "#/components/schemas/AccountData"

    UpdateAccountReq:
      type: object
      required:
        - accountCode
        - accountData
      properties:
        accountCode:
          type: string
        accountData:
          $ref: "#/components/schemas/AccountData"

    SearchAccountReq:
      type: object
      required:
        - accountCriteria
        - page
      properties:
        page:
          $ref: "#/components/schemas/Page"
        accountCriteria:
          type: array
          items:
            $ref: "#/components/schemas/AccountCriteria"
        maskCategoryCode:
          type: string
        status:
          $ref: "#/components/schemas/AccountStatusEnum"

    SearchAccountCreditReq:
      type: object
      required:
        - page
        - accountCode
      properties:
        page:
          $ref: "#/components/schemas/Page"
        saleDate:
          $ref: "#/components/schemas/DateFromTo"
        accountCode:
          type: string
        operationType:
          $ref: "#/components/schemas/SearchCreditTypeEnum"

    AccountCreditRechargeReq:
      type: object
      required:
        - amount
        - accountCode
      properties:
        amount:
          type: number
        accountCode:
          type: string
        note:
          type: string

    CheckCreditAccountReq:
      type: object
      required:
        - accountCode
        - amount
      properties:
        accountCode:
          type: string
        amount:
          type: number
    # ==================================================
    # REQUEST GROUP: ASSET
    # ==================================================
    CreateImageReq:
      type: object
      required:
        - image
      properties:
        image:
          $ref: "#/components/schemas/Image"

    # ==================================================
    # REQUEST GROUP: AUTH
    # ==================================================
    SigninReq:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
        password:
          $ref: "#/components/schemas/EncryptedPasswordType"
        bosFieldCode:
          $ref: "#/components/schemas/FieldCodeType"
        bosAccountCategoryCode:
          type: array
          items:
            type: string

    ChangePasswordReq:
      type: object
      required:
        - accountCode
        - oldPassword
        - newPassword
      properties:
        accountCode:
          type: string
        oldPassword:
          $ref: "#/components/schemas/EncryptedPasswordType"
        newPassword:
          $ref: "#/components/schemas/EncryptedPasswordType"

    ResetPasswordReq:
      type: object
      required:
        - accountCode
      properties:
        accountCode:
          type: string
        VisionSendEMail:
          description: if set to true, send mail
          type: boolean

    # ==================================================
    # REQUEST GROUP: CART
    # ==================================================
    CheckCartReq:
      type: object
      required:
        - shopCart
      properties:
        capacityManagement:
          type: boolean
          description: Toggle capacity management feature for capacity and assigned seating performances
        ignoreWarnings:
          type: boolean
          description: Toggle check on warnings for Extended Ticket Info, Variable Expiration Range, Force Ticket to Media Link and Ticket Holder.
        shopCart:
          $ref: "#/components/schemas/ShopCart"

    TryExchangeReq:
      type: object
      required:
        - exchangeCart
      properties:
        ignoreWarnings:
          type: boolean
          description: Toggle check on warnings for Extended Ticket Info, Variable Expiration Range, Force Ticket to Media Link and Ticket Holder.
        exchangeCart:
          $ref: "#/components/schemas/ExchangeCart"

    TryRenewalReq:
      type: object
      required:
        - renewalCart
      properties:
        renewalCart:
          $ref: "#/components/schemas/RenewalCart"

    # ==================================================
    # REQUEST GROUP: ORDER
    # ==================================================
    BeginOrderTransReq:
      type: object
      required:
        - shopCart
        - reservationOwnerCode
      properties:
        shopCart:
          $ref: "#/components/schemas/ShopCart"
        reservationOwnerCode:
          type: string
          description: accountCode of the user logged in
        delivery:
          $ref: "#/components/schemas/Delivery"
        paymentCode:
          type: string
        orderCode:
          type: string
          description: Used to modify an existing order

    CancelOrderTransReq:
      type: object
      required:
        - orderCode
      properties:
        orderCode:
          type: string

    ConfirmOrderTransReq:
      type: object
      required:
        - orderCode
      properties:
        orderCode:
          type: string
        payments:
          type: array
          items:
            $ref: "#/components/schemas/PaymentApplied"
        insuranceRef:
          type: string

    SearchOrderReq:
      type: object
      required:
        - page
      properties:
        page:
          $ref: "#/components/schemas/Page"
        saleDate:
          $ref: "#/components/schemas/DateFromTo"
        publicOrderCode:
          type: string
        visitDate:
          $ref: "#/components/schemas/DateFromTo"
        statusCode:
          $ref: "#/components/schemas/OrderStatusEnum"
        externalOrderCode:
          type: string
        reservationOwnerAccount:
          $ref: "#/components/schemas/AccountSearch"
        sort:
          $ref: "#/components/schemas/SortEnum"

    SearchOrderTicketsReq:
      type: object
      required:
        - page
      properties:
        page:
          $ref: "#/components/schemas/Page"
        lastModifiedDate:
          $ref: "#/components/schemas/DateFromTo"
        reservationOwnerAccount:
          $ref: "#/components/schemas/AccountSearch"
        productCodes:
          type: array
          items:
            type: string
        sort:
          $ref: "#/components/schemas/SortEnum"

    ExchangeTransReq:
      type: object
      required:
        - shopCart
        - reservationOwnerCode
      properties:
        shopCart:
          $ref: "#/components/schemas/ExchangeCart"
        reservationOwnerCode:
          type: string
          description: accountCode of the user logged in
        paymentCode: #TODO not used in BOS
          type: string

    RenewalTransReq:
      type: object
      required:
        - shopCart
        - reservationOwnerCode
      properties:
        shopCart:
          $ref: "#/components/schemas/RenewalCart"
        reservationOwnerCode:
          type: string
          description: accountCode of the user logged in
        paymentCode: #TODO not used in BOS
          type: string

    LinkSubscriptionToOrderReq:
      type: object
      required:
        - subscriptionCode
        - orderCode
      properties:
        subscriptionCode:
          type: string
        orderCode:
          type: string

    # ==================================================
    # REQUEST GROUP: SEAT
    # ==================================================
    BestSeatReq:
      type: object
      required:
        - sectionCode
        - quantity
      properties:
        sectionCode:
          description: A group of seats
          type: string
        quantity:
          type: string
        productCode:
          type: string
        bosItemGuid:
          type: string

    # =================================================
    # REQUEST GROUP: SELL
    # =================================================

    UpSellReq:
      type: object
      required:
        - shopCart
      properties:
        shopCart:
          $ref: "#/components/schemas/ShopCart"

    CrossSellReq:
      type: object
      required:
        - shopCart
      properties:
        shopCart:
          $ref: "#/components/schemas/ShopCart"

    # ==================================================
    # RESPONSES GROUP: ACCOUNT
    # ==================================================

    CreateAccountRes:
      type: object
      required:
        - accountCode
        - person
      properties:
        accountCode:
          type: string
        person:
          $ref: "#/components/schemas/Person"

    ReadAccountRes:
      type: object
      required:
        - account
      properties:
        account:
          type: array
          items:
            $ref: "#/components/schemas/Account"

    ReadAccountFinancialRes:
      type: object
      required:
        - accountFinancial
      properties:
        accountFinancial:
          type: array
          items:
            $ref: "#/components/schemas/AccountFinancial"

    UpdateAccountRes:
      type: object
      properties:
        accountCode:
          type: string
        person:
          $ref: "#/components/schemas/Person"

    SearchAccountRes:
      type: object
      required:
        - pagination
      properties:
        pagination:
          $ref: "#/components/schemas/Pagination"
        accountCode:
          type: array
          items:
            type: string

    SearchAccountCreditRes:
      type: object
      required:
        - pagination
      properties:
        pagination:
          $ref: "#/components/schemas/Pagination"
        creditItems:
          type: array
          items:
            $ref: "#/components/schemas/CreditItem"

    AccountCreditRechargeRes:
      type: object
      required:
        - orderCode
        - total
      properties:
        orderCode:
          type: string
        total:
          $ref: "#/components/schemas/PriceComplete"
        date:
          $ref: "#/components/schemas/DatetimeType"

    CheckCreditAccountRes:
      type: object
      required:
        - canPay
        - remainCredit
      properties:
        canPay:
          type: boolean
        remainCredit:
          type: number
    # ==================================================
    # RESPONSES GROUP: ASSET
    # ==================================================
    ReadImageRes:
      type: array
      items:
        $ref: "#/components/schemas/Image"

    CreateImageRes:
      type: object
      required:
        - imageCode
      properties:
        imageCode:
          type: string

    # ==================================================
    # RESPONSES GROUP: AUTH
    # ==================================================
    SigninRes:
      type: object
      required:
        - accountCode
        - displayName
      properties:
        accountCode:
          type: string
        displayName:
          description: private person (first name and last name) or (last name and first name), Legal person (company name)
          type: string

    SearchLoginAccountRes:
      type: object
      properties:
        active:
          type: boolean
        accountCode:
          type: string
        displayName:
          type: string
        email:
          type: string
        firstName:
          description: Useful for referring to the user in a less formal way than the displayName which also contains the surname. If not filled in, then the displayName is used
          type: string

    ChangePasswordRes:
      type: object
      required:
        - accountCode
      properties:
        accountCode:
          type: string

    ResetPasswordRes:
      type: object
      required:
        - accountCode
      properties:
        accountCode:
          type: string
        temporaryPassword:
          $ref: "#/components/schemas/EncryptedPasswordType"

    # ==================================================
    # RESPONSES GROUP: CART
    # ==================================================
    CheckCartRes:
      type: object
      properties:
        preOrder:
          $ref: "#/components/schemas/PreOrderCart"

    TryExchangeRes:
      type: object
      properties:
        preOrder:
          $ref: "#/components/schemas/PreExchangeOrderCart"

    TryRenewalRes:
      type: object
      properties:
        preOrder:
          $ref: "#/components/schemas/PreRenewalOrderCart"

    # ==================================================
    # RESPONSES GROUP: PARENT FAMILY
    # ==================================================
    FindParentFamiliesRes:
      type: object
      required:
        - parentFamilies
      properties:
        parentFamilies:
          type: array
          items:
            type: string

    ReadParentFamilyRes:
      type: object
      required:
        - parentFamilies
      properties:
        parentFamilies:
          type: array
          items:
            $ref: "#/components/schemas/ParentFamily"

    # ==================================================
    # RESPONSES GROUP: FAMILY
    # ==================================================
    ReadFamilyRes:
      type: object
      required:
        - families
      properties:
        families:
          type: array
          items:
            $ref: "#/components/schemas/Family"

    # ==================================================
    # RESPONSES GROUP: THEME
    # ==================================================
    ReadThemeRes:
      type: object
      required:
        - themes
      properties:
        themes:
          type: array
          items:
            $ref: "#/components/schemas/Theme"

    # ==================================================
    # RESPONSES GROUP: MASK
    # ==================================================
    ReadDataListRes:
      type: object
      required:
        - dataList
      properties:
        dataList:
          type: array
          items:
            $ref: "#/components/schemas/DataList"

    ReadMaskCategoryRes:
      type: object
      required:
        - maskCategory
      properties:
        maskCategory:
          type: array
          items:
            $ref: "#/components/schemas/MaskCategory"

    # ==================================================
    # RESPONSES GROUP: OFFER
    # ==================================================

    FindOfferCodesByFamilyRes:
      type: object
      required:
        - families
      properties:
        families:
          type: array
          description: List of family codes (ex. Statistical Groups)
          items:
            $ref: "#/components/schemas/FamilyOfferRef"

    ReadOfferRes:
      type: object
      required:
        - offers
      properties:
        offers:
          type: array
          items:
            $ref: "#/components/schemas/Offer"

    # ==================================================
    # RESPONSES GROUP: ORDER
    # ==================================================
    BeginOrderTransRes:
      type: object
      required:
        - preOrder
      properties:
        orderCode:
          type: string
        publicOrderCode:
          type: string
        preOrder:
          $ref: "#/components/schemas/PreOrderCart"

    CancelOrderTransRes:
      type: object
      required:
        - orderCode
      properties:
        orderCode:
          type: string

    ConfirmOrderTransRes:
      type: object
      required:
        - orderCode
      properties:
        orderCode:
          type: string

    ReadOrderDetailsRes:
      type: object
      required:
        - orders
      properties:
        orders:
          type: array
          items:
            $ref: "#/components/schemas/OrderDetails"

    SearchOrderRes:
      type: object
      required:
        - pagination
        - orders
      properties:
        pagination:
          $ref: "#/components/schemas/Pagination"
        orders:
          type: array
          items:
            $ref: "#/components/schemas/Order"

    SearchOrderTicketsRes:
      type: object
      required:
        - pagination
        - orders
      properties:
        pagination:
          $ref: "#/components/schemas/Pagination"
        orders:
          type: array
          items:
            $ref: "#/components/schemas/Order"

    ExchangeTransRes:
      type: object
      required:
        - preOrder
      properties:
        orderCode:
          type: string
        publicOrderCode:
          type: string
        preOrder:
          $ref: "#/components/schemas/PreExchangeOrderCart"

    RenewalTransRes:
      type: object
      required:
        - preOrder
      properties:
        orderCode:
          type: string
        publicOrderCode:
          type: string
        preOrder:
          $ref: "#/components/schemas/PreRenewalOrderCart"

    # ==================================================
    # RESPONSES GROUP: PRICE
    # ==================================================

    FindPricesRes:
      type: object
      required:
        - products
      properties:
        products:
          type: array
          items:
            $ref: "#/components/schemas/ProductCodesRef"

    # ==================================================
    # RESPONSES GROUP: PERFORMANCE
    # ==================================================

    FindCalendarDaysRes:
      type: object
      required:
        - days
      properties:
        days:
          type: array
          items:
            $ref: "#/components/schemas/Day"

    FindPerformanceByDayRes:
      type: object
      description: For BOS always sellable = true
      required:
        - performances
      properties:
        performances:
          type: array
          items:
            $ref: "#/components/schemas/Performance"

    # ==================================================
    # RESPONSES GROUP: PRODUCT
    # ==================================================

    FindProductCodesRes:
      type: object
      required:
        - products
      properties:
        products:
          type: array
          items:
            $ref: "#/components/schemas/ProductCodesRef"
        productCodeWithSubProductCodes:
          type: array
          description: Relationships of product codes (packages) with subproduct codes (since 1.8.0)
          items:
            $ref: "#/components/schemas/ProductCodeWithSubProductCodes"

    ReadProductRes:
      type: object
      required:
        - products
      properties:
        products:
          type: array
          items:
            $ref: "#/components/schemas/Product"

    # ==================================================
    # RESPONSES GROUP: SEAT
    # ==================================================
    BestSeatRes:
      type: object
      required:
        - bosItemGuid
      properties:
        bosItemGuid:
          type: string

    # ==================================================
    # RESPONSES GROUP: SELL
    # ==================================================
    UpSellRes:
      type: object
      properties:
        upSellGroup:
          type: array
          items:
            $ref: "#/components/schemas/UpSellGroup"

    CrossSellRes:
      type: object
      properties:
        crossSellGroup:
          type: array
          items:
            $ref: "#/components/schemas/CrossSellGroup"

    # ==================================================
    # RESPONSES GROUP: RENEWAL
    # ==================================================
    ReadRenewalProductsRes:
      type: array
      items:
        $ref: "#/components/schemas/RenewalProductInfo"

    RenewalProductInfo:
      type: object
      required:
        - products
      properties:
        mediaCode:
          type: string
        ticketCode:
          type: string
        dateActiveTo:
          $ref: "#/components/schemas/DateType"
        dateRenewalExpired:
          $ref: "#/components/schemas/DateType"
        products:
          type: array
          items:
            $ref: "#/components/schemas/RenewalProduct"

    # ==================================================
    # RESPONSES GROUP: UPGRADE
    # ==================================================
    ReadUpgradeProductsRes:
      type: array
      items:
        $ref: "#/components/schemas/UpgradeProductsInfo"

    UpgradeProductsInfo:
      type: object
      required:
        - products
      properties:
        mediaCode:
          type: string
        ticketCode:
          type: string
        dateActiveTo:
          $ref: "#/components/schemas/DateType"
        dateRenewalExpired:
          $ref: "#/components/schemas/DateType"
        products:
          type: array
          items:
            $ref: "#/components/schemas/RenewalProduct"

    # ==================================================
    # RESPONSES GROUP: TICKET
    # ==================================================

    ReadTicketRes:
      type: array
      items:
        $ref: "#/components/schemas/Ticket"

    ReadMoneyCardRes:
      type: object
      required:
        - mediaCode
        - balance
      properties:
        mediaCode:
          type: string
        balance:
          $ref: "#/components/schemas/PriceComplete"

    ReadExchangeInfoRes:
      type: array
      items:
        $ref: "#/components/schemas/ExchangeInfo"

    # ==================================================
    # ENTITIES GROUP: ACCOUNT
    # ==================================================
    Account:
      type: object
      required:
        - accountCode
        - person
        - data
      properties:
        accountCode:
          type: string
        person:
          $ref: "#/components/schemas/Person"
        data:
          $ref: "#/components/schemas/AccountData"

    AccountData:
      type: object
      required:
        - fields
      properties:
        fields:
          type: array
          items:
            $ref: "#/components/schemas/Field"
        bosAccountCategoryCode:
          description: defines the ak to use instead of the one derived from accountCategoryType
          type: string

    Field:
      type: object
      required:
        - fieldCode
      properties:
        fieldCode:
          type: integer
        value:
          type: string
        kind:
          $ref: "#/components/schemas/FieldKindEnum"

    Person:
      description: Minimum descriptive reference to a person (private or legal). For example display name of the logged in user
      type: object
      required:
        - displayName
      properties:
        displayName:
          type: string
        email:
          type: string
        firstName:
          description: Useful for referring to the user in a less formal way than the displayName which also contains the surname. If not filled in, then the DisplayName is used
          type: string

    AccountFinancial:
      description: "Financial account information"
      type: object
      properties:
        validPaymentList:
          type: array
          items:
            $ref: "#/components/schemas/ValidPayment"
        creditInfo:
          $ref: "#/components/schemas/CreditInfo"
        priceListCode:
          type: string
        billingInfo:
          $ref: "#/components/schemas/BillingInfo"
        taxExemptable:
          type: boolean

    BillingInfo:
      type: object
      properties:
        billingCode:
          type: string
        hasParent:
          type: boolean

    ValidPayment:
      type: object
      properties:
        validPaymentCode:
          type: string
        validPaymentDesc:
          type: string

    CreditInfo:
      type: object
      properties:
        creditPerTrans:
          type: number
        totalCredit:
          type: number
        itemPerTrans:
          type: integer
        creditDays:
          type: number
        remainCredit:
          type: number
        minimumDepositLimit:
          type: number
        totalActivity:
          type: number
        totalPaid:
          type: number
        amountDue:
          type: number

    CreditItem:
      type: object
      properties:
        credit:
          $ref: "#/components/schemas/Credit"
        settleSale:
          $ref: "#/components/schemas/Sale"
        originSale:
          $ref: "#/components/schemas/Sale"

    Sale:
      type: object
      properties:
        saleCode:
          type: string
        date:
          $ref: "#/components/schemas/DatetimeType"

    Credit:
      type: object
      required:
        - creditCode
        - creditDesc
        - creditType
        - date
        - payment
        - amount
      properties:
        creditCode:
          type: string
        creditDesc:
          type: string
        creditType:
          type: string
        date:
          $ref: "#/components/schemas/DatetimeType"
        payment:
          $ref: "#/components/schemas/Payment"
        amount:
          $ref: "#/components/schemas/PriceComplete"
        dueDate:
          $ref: "#/components/schemas/DatetimeType"

    Payment:
      type: object
      required:
        - paymentCode
        - paymentDesc
        - paymentType
      properties:
        paymentCode:
          type: string
        paymentDesc:
          type: string
        paymentType:
          type: string

    AccountSearch:
      type: object
      properties:
        accountCode:
          type: string
        name:
          type: string
        email:
          type: string
        surname:
          type: string

    AccountCriteria:
      type: object
      properties:
        fieldCode:
          type: string
        value:
          type: string
        searchType:
          $ref: "#/components/schemas/SearchTypeEnum"

    # ==================================================
    # ENTITIES GROUP: ASSET
    # ==================================================

    Image:
      type: object
      required:
        - imageCode
        - content
      properties:
        imageCode:
          type: string
        fileName:
          type: string
        content:
          type: string
          format: base64

    # ==================================================
    # ENTITIES GROUP: CART
    # ==================================================
    Cart:
      type: object
      required:
        - orderItems
        - total
      properties:
        total:
          $ref: "#/components/schemas/PriceComplete"
        promotionApplied:
          type: array
          items:
            $ref: "#/components/schemas/PromotionApplied"
        orderItems:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"

    ExchangeOrderCart:
      type: object
      required:
        - orderItems
        - total
      properties:
        total:
          $ref: "#/components/schemas/PriceComplete"
        promotionApplied:
          type: array
          items:
            $ref: "#/components/schemas/PromotionApplied"
        orderItems:
          type: array
          items:
            $ref: "#/components/schemas/ExchangeOrderItem"

    RenewalOrderCart:
      type: object
      required:
        - orderItems
        - total
      properties:
        total:
          $ref: "#/components/schemas/PriceComplete"
        promotionApplied:
          type: array
          items:
            $ref: "#/components/schemas/PromotionApplied"
        orderItems:
          type: array
          items:
            $ref: "#/components/schemas/RenewalOrderItem"

    ShopCart:
      type: object
      description: list of products chosen by user
      required:
        - cartItems
      properties:
        cartItems:
          type: array
          items:
            $ref: "#/components/schemas/ShopCartItem"
        cartCode:
          description: you can pass a cart code obtained previously
          type: string
        coupons:
          type: array
